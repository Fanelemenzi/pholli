{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'admin/css/policy_features_inline.css' %}">
    <script type="text/javascript" src="{% static 'admin/js/policy_features_inline.js' %}"></script>
    <style>
        /* Additional inline styles for better UX */
        .insurance-type-message {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fieldset h2.collapsed::after {
            content: " [Click to expand]";
            font-size: 12px;
            color: #666;
            font-weight: normal;
        }
        
        .field-validation-error {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="policy-admin-wrapper">
        {{ block.super }}
    </div>
{% endblock %}
